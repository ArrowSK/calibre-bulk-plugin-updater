name: Package checks
on:
  push:
  pull_request:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q src
      - name: Build and verify ZIP
        run: python build.py
